name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hotel
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel -d hotel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DEBUG: "0"
      SECRET_KEY: ci-only-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      # Pin exato: o setup-uv publica tag movel de major so ate v7.
      # v8/v9/v10 existem apenas como versao exata, e `@v10` nao resolve.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: "Guard - dinheiro nunca usa float (SPEC 0.3)"
        working-directory: ${{ github.workspace }}
        run: '! grep -RnE "float\(" backend/hotel backend/accounts'

      - name: Instalar dependencias travadas
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Suite backend com cobertura
        run: uv run pytest --cov=hotel --cov=accounts --cov-fail-under=85 -q

  frontend:
    name: frontend (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # Os testes de data comparam com o relogio local: o CI roda no fuso de producao.
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      # Espelho da guarda do backend: aqui o dinheiro nunca vira numero.
      - name: Guard - money never becomes a number
        run: '! grep -RnE "Number\(|parseFloat|parseInt|toLocaleString|Intl\.NumberFormat" src/lib/money.ts src/features/reservations/CheckoutStatementDialog.tsx src/features/reservations/components/ReservationSections.tsx src/features/pricing'

      - name: Tests with coverage floor
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: warn
