name: hotel

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel}
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel} -d ${POSTGRES_DB:-hotel}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Publicada para o caminho hibrido do README. DB_PORT_HOST evita colisao
      # com um PostgreSQL ja rodando na maquina.
      - "${DB_PORT_HOST:-5432}:5432"

  redis:
    image: redis:7-alpine
    # Sem portas publicadas: o unico cliente e o backend, pela rede interna do
    # compose. Tambem sem volume -- o conteudo e cache de throttle, descartavel
    # por definicao; reiniciar o servico so zera as janelas em andamento.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    env_file: .env
    environment:
      DEBUG: "0"
      # A demo serve em http, e sem TLS o navegador descarta cookie `Secure` (ver .env.example).
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      # Dentro da rede do compose o banco e o servico `db` na porta interna.
      DB_HOST: db
      DB_PORT: "5432"
      # Presente => cache do throttle no Redis; ausente (execucao nativa e
      # hibrida do README) => settings.py cai no DatabaseCache do Postgres.
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Cadeia de subida no proprio compose: zero arquivos .sh no repositorio (SPEC 8.5/R7).
    # `createcachetable` fica: e no-op com Redis e preserva o fallback para o
    # Postgres. `--threads 2` troca o worker sync pelo gthread (o gunicorn faz
    # isso sozinho quando threads > 1): uma pergunta a Iris (varias chamadas
    # HTTP para fora, com orcamento de 15s no total) passa a bloquear uma
    # thread, nao o worker inteiro.
    command: sh -c "uv run python manage.py migrate --noinput && uv run python manage.py createcachetable && uv run python manage.py collectstatic --noinput && uv run python manage.py seed_demo && uv run gunicorn config.wsgi -b 0.0.0.0:8000 -w ${GUNICORN_WORKERS:-3} --threads 2"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    # O container roda o servidor de desenvolvimento do Vite: sem estes volumes
    # ele serviria a copia congelada no `COPY` da imagem, e editar o fonte no
    # host nao mudaria nada na tela ate um rebuild.
    #   - o bind monta o fonte do host por cima de /app (HMR ve cada save);
    #   - o volume anonimo preserva o node_modules instalado na imagem, que o
    #     bind esconderia -- o layout de symlinks do pnpm e os binarios nativos
    #     sao da plataforma da imagem, nao do host.
    # Mexeu no pnpm-lock.yaml? `docker compose up -d --build -V frontend`: sem
    # `-V` o compose reaproveita o volume anonimo antigo e o node_modules novo
    # da imagem nunca aparece no container.
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  pgdata:
