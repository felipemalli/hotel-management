name: hotel

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel}
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel} -d ${POSTGRES_DB:-hotel}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Publicada para o caminho hibrido do README. DB_PORT_HOST evita colisao
      # com um PostgreSQL ja rodando na maquina.
      - "${DB_PORT_HOST:-5432}:5432"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      # Dentro da rede do compose o banco e o servico `db` na porta interna.
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    # Cadeia de subida no proprio compose: zero arquivos .sh no repositorio (SPEC 8.5/R7).
    command: sh -c "uv run python manage.py migrate --noinput && uv run python manage.py createcachetable && uv run python manage.py collectstatic --noinput && uv run python manage.py seed_demo && uv run gunicorn config.wsgi -b 0.0.0.0:8000 -w ${GUNICORN_WORKERS:-3}"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  pgdata:
