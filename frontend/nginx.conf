server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # BrowserRouter: /reservas/123 nao e um arquivo — devolve o SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
