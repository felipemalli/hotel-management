[project]
name = "hotel-backend"
version = "0.1.0"
description = "Gestao de Hospedes de Hotel - backend"
requires-python = ">=3.13"
dependencies = [
    "django==5.2.*",
    "djangorestframework",
    "djangorestframework-simplejwt",
    "drf-spectacular[sidecar]",
    "psycopg[binary]",
    "django-csp>=4",
    "whitenoise",
    "httpx",
    "gunicorn",
    "redis>=8.1.0",
    "phonenumberslite>=9.0.38",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "factory-boy",
    "freezegun",
    "ruff",
    "import-linter>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.isort]
# `core` e `tests` sao pacotes do repositorio, nao dependencias: sem isto o
# ruff os agruparia com os de terceiros conforme o que estiver instalado.
known-first-party = ["accounts", "ai", "config", "core", "hotel", "tests"]

[tool.ruff.lint.per-file-ignores]
# Migracoes sao geradas pelo Django; nao se reformatam a mao.
"*/migrations/*" = ["E501", "I001"]

[tool.coverage.run]
# Migracoes sao geradas e aplicadas pelo `migrate`, nao exercitadas por teste:
# medi-las mede a fabrica do Django, e um laco de backfill nunca percorrido
# conta contra o piso de cobertura do codigo que importa.
omit = ["*/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra"

[tool.importlinter]
root_packages = ["core", "accounts", "hotel", "ai", "config"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "DAG: ai -> reservations -> folhas -> (core | accounts)"
type = "layers"
layers = ["ai", "hotel.reservations", "hotel.guests | hotel.rooms | hotel.billing", "core | accounts"]
ignore_imports = ["hotel.rooms.services -> hotel.reservations.selectors"]   # unica excecao documentada (ARQUITECTURE.md)

[[tool.importlinter.contracts]]
name = "billing nao conhece o resto do dominio"
type = "forbidden"
source_modules = ["hotel.billing"]
forbidden_modules = ["hotel.guests", "hotel.rooms", "hotel.reservations", "ai"]

[[tool.importlinter.contracts]]
name = "core e accounts sao folhas; ninguem do dominio importa ai ou config"
type = "forbidden"
source_modules = ["core", "accounts", "hotel"]
forbidden_modules = ["ai", "config"]
